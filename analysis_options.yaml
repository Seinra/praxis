# Praxis analysis baseline (owner decision 2026-10-23: strict + custom_lint).
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
# House-rule analyzer plugin (tools/praxis_lints, own pubspec + analyzer 14):
# resolved in an isolated synthetic package, so it never fights the root
# analyzer 7 line; restart the analysis server after changing this section.
plugins:
  praxis_lints:
    path: tools/praxis_lints
    diagnostics:
      no_single_letter: true
      no_banned_names: true

linter:
  rules:
    # House rules with analyzer support (thesis invariant 3 + quality bar):
    public_member_api_docs: true
    always_declare_return_types: true
    avoid_dynamic_calls: true
    no_wildcard_variable_uses: true
    prefer_single_quotes: true
    directives_ordering: true
