---
# Praxis loop state (machine-readable). ODD-track canonical is
# odd/tasks/*.md + Engram mirror + todo projection;
# phase-*.json is content-loops-only and NOT used here.
schemaVersion: 1
loop: PRAXIS_LOOP.md
vision: VISION.md
methodology: ODD
phases:
  - id: CONTEXT
    skills: [foundry-explore]
    gate: map with path:line evidence
  - id: INVESTIGATE
    skills: [external-evidence]
    gate: cited findings with REFERENCES pins
  - id: PLAN
    skills: [foundry-requirements, cognitive-doc-design]
    gate: odd/tasks/<feature>.md + mirror + todo reconciled
  - id: IMPLEMENT
    skills:
      - atelier-dart
      - foundry-craft
      - foundry-docs
      - cognitive-doc-design
      - loop-engineering
    gate: >
      verifiable artifact, analyzer clean;
      loop-engineering only when deliverable IS loop;
      docs units load the atelier-dart + foundry-docs +
        cognitive-doc-design trio
  - id: VALIDATE
    skills: [atelier-dart, foundry-review]
    gate: dart test + analyze + format green; Go/No-Go ledger when gated
  - id: FIX
    skills: [bounded-writer, foundry-debug]
    gate: fix <= 3 attempts, then STOP to HITL
  - id: DEPOSIT
    skills: [engram]
    gate: typed deposits + session summary
dependencies:
  dart: "3.13.5"
  flutter: "3.47.7"
  package: praxis
  consumer: catalyst
governance:
  max_fix_attempts: 3
  hitl_triggers:
    - structural_schema_change
    - security_finding
    - unreproducible_divergence
    - external_policy_interpretation
    - fix_limit_exceeded
  tdd_scope: {library_logic: true, prose_config: false}
  routing:
    inline_direct_max_files: 3
    delegate_scout_min_files: 4
    single_writer_min_files: 2
    pause_delegate_calls: 20
    pause_delegate_reads: 5
  budget_guard: {max_changed_lines_before_chained_pr: 400}
validation:
  pre_phase: ["dart analyze"]
  post_phase:
    - "dart test"
    - "dart format --output=none --set-exit-if-changed ."
    - "dart doc"
docs:
  style: cognitive-doc-design
state:
  dir: ".loop-modules"
  files: {status: "STATUS.md", success_metrics: "SUCCESS_METRICS.md"}
currentFeature: odd/tasks/praxis-docs-coherence.md
